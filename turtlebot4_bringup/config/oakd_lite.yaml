/oakd:
  ros__parameters:
    camera:
      i_enable_ir: true
      i_nn_type: none
      i_pipeline_type: 'Depth'
      i_usb_speed: SUPER_PLUS
      i_enable_rgbd: true
      i_tf_camera_model: 'OAK-D-LITE'
      i_tf_camera_name: 'oak'
      i_tf_parent_frame: 'oak-d-base-frame'
    pipeline_gen:
      i_enable_imu: false
    left:
      i_low_bandwidth: true
      i_resolution: 480P
      i_fps: 15.0
    right:
      i_low_bandwidth: true
      i_resolution: 480P
      i_fps: 15.0
      i_publish_topic: true
    stereo:
      i_width: 640
      i_height: 480
      i_subpixel: false
      i_lr_check: false
      i_align_depth: true
      i_output_disparity: false
      i_output_depth: true
      i_depth_preset: HIGH_ACCURACY
      i_low_bandwidth: true
      i_publish_topic: true
      i_fps: 15.0
      i_board_socket_id: 2
    use_sim_time: false